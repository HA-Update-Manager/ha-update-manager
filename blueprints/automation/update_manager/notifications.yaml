blueprint:
  name: "Update Manager: notifications"
  description: >-
    One notification setup for Update Manager, matching the built-in "Scheduled updates"/"Failed
    updates" persistent notifications closely enough to safely replace them: a scheduled auto-install
    heads-up, an installed confirmation, a failed-install alert, and a per-entity "needs a manual
    install" reminder with an Install button right on it. Each one can be turned off independently.
    Notifications replace themselves instead of stacking, and clear themselves once resolved, reading
    the same live sensors those two persistent notifications are themselves built from.
  domain: automation
  source_url: https://github.com/HA-Update-Manager/ha-update-manager/blob/main/blueprints/automation/update_manager/notifications.yaml
  input:
    notify_target:
      name: Notification target
      description: >-
        The notify action to send these to, exactly as you'd use it in an action step, e.g.
        notify.mobile_app_your_phone.
      selector:
        text: {}
    notify_scheduled:
      name: Notify on scheduled auto-install
      default: true
      selector:
        boolean: {}
    notify_installed:
      name: Notify when something gets installed
      default: true
      selector:
        boolean: {}
    notify_install_failed:
      name: Notify when an install fails
      default: true
      selector:
        boolean: {}
    notify_manual_action:
      name: Notify when something needs a manual install
      default: true
      selector:
        boolean: {}

mode: queued
# 30, not the default 10, found live, 2026-11-04: a real "Update all" batch
# (14 entities, several sensor changes each) queued more runs than 10 could
# hold, and a run dropped past that limit is gone for good, nothing later
# ever catches up for it (see the "installed" trigger's own comment below
# for why that matters more there than for the sensor-based triggers).
max: 30

trigger:
  - trigger: state
    entity_id: sensor.update_manager_scheduled_installs
    id: pending_changed
  - trigger: event
    event_type: update_manager_installed
    # An event, not a sensor state like every other trigger here: a dropped
    # run (mode: queued's own max above) means this specific install's own
    # notification is simply gone, nothing to diff against later. The
    # sensor-based triggers below self-heal from a dropped run instead,
    # since a later run just compares against whatever the sensor's real
    # current state already is.
    id: installed
  - trigger: state
    entity_id: sensor.update_manager_failed_installs
    id: failed_changed
  - trigger: state
    entity_id: sensor.update_manager_needs_manual_action
    id: needs_manual_action
  - trigger: event
    event_type: mobile_app_notification_action
    id: notification_action

variables:
  notify_target: !input notify_target
  notify_scheduled: !input notify_scheduled
  notify_installed: !input notify_installed
  notify_install_failed: !input notify_install_failed
  notify_manual_action: !input notify_manual_action

action:
  - choose:
      # Scheduled auto-install: reads sensor.update_manager_scheduled_installs, the same live list
      # install_manager.py's own "Scheduled updates" persistent notification is built from, so this
      # bundles/clears exactly as reliably as that one does (including a cancelled install dropping
      # out, which the update_manager_announced event alone has no way to signal). Passive: this is an
      # FYI, not something that needs you right now.
      - conditions:
          - condition: trigger
            id: pending_changed
          - "{{ notify_scheduled }}"
          # Direct user feedback, 2026-11-08: every entity already pending
          # before an HA restart got re-notified the instant it started
          # back up. This automation (like every automation) only starts
          # comparing trigger.from_state/to_state once it reloads, so the
          # very first time this sensor's own state is set after that has
          # no genuine "before" to diff against (trigger.from_state is
          # none) -- before_ids below reads as empty regardless of what was
          # already shown before the restart, and everything still pending
          # looks brand new. Skipped outright rather than notified on a
          # from_state this automation never actually saw happen.
          - "{{ trigger.from_state is not none }}"
        sequence:
          - variables:
              before_ids: >-
                {{ trigger.from_state.attributes.entities | default([]) | map(attribute='entity_id') | list }}
              after: "{{ trigger.to_state.attributes.entities | default([]) }}"
              after_ids: "{{ after | map(attribute='entity_id') | list }}"
          - repeat:
              for_each: "{{ before_ids | reject('in', after_ids) | list }}"
              sequence:
                - action: "{{ notify_target }}"
                  data:
                    message: "clear_notification"
                    data:
                      tag: "update_manager_announced_{{ repeat.item }}"
          - repeat:
              for_each: "{{ after }}"
              sequence:
                - action: "{{ notify_target }}"
                  data:
                    title: "Update Manager: Scheduled update"
                    message: >-
                      {{ state_attr(repeat.item.entity_id, 'friendly_name') | regex_replace("\\s*Update$", "") }}
                      to version {{ repeat.item.to_version }} in
                      {{ as_datetime(repeat.item.execute_at) | time_until }}
                      (on {{ as_timestamp(repeat.item.execute_at) | timestamp_custom('%d-%m-%Y %H:%M') }}).
                    data:
                      url: /update-manager/updates
                      clickAction: /update-manager/updates
                      group: update_manager_announced
                      tag: "update_manager_announced_{{ repeat.item.entity_id }}"
                      channel: "Update Manager"
                      notification_icon: "mdi:update"
                      importance: low
                      push:
                        interruption-level: passive

      # Installed: clears the scheduled-announcement notification above (if it was ever shown), then
      # its own passive confirmation, same reasoning, nothing needs you here either.
      - conditions:
          - condition: trigger
            id: installed
        sequence:
          - variables:
              device_name: >-
                {{ state_attr(trigger.event.data.entity_id, 'friendly_name') | regex_replace("\\s*Update$", "") }}
              reason: >-
                {{ {"trusted_voter": "a trusted vote", "rules": "your own rules", "whitelist": "the always-auto-install list"}.get(trigger.event.data.auto_install_reason) }}
          - if: "{{ notify_scheduled }}"
            then:
              - action: "{{ notify_target }}"
                data:
                  message: "clear_notification"
                  data:
                    tag: "update_manager_announced_{{ trigger.event.data.entity_id }}"
          - if: "{{ notify_installed }}"
            then:
              - action: "{{ notify_target }}"
                data:
                  title: "Update Manager: Update installed"
                  message: >-
                    {{ device_name }} updated from {{ trigger.event.data.from_version }} to
                    {{ trigger.event.data.to_version }}
                    {%- if trigger.event.data.auto_installed %}
                    (auto-installed, {{ reason }})
                    {%- elif trigger.event.data.install_method == "manual" %}
                    (installed manually)
                    {%- endif %}.
                  data:
                    url: /update-manager/history
                    clickAction: /update-manager/history
                    channel: "Update Manager"
                    notification_icon: "mdi:update"
                    importance: low
                    push:
                      interruption-level: passive

      # Install failed: reads sensor.update_manager_failed_installs, same bundling/clearing reasoning
      # as the pending branch above. Having the real reason tag available now (not just the entity_id/
      # to_version the update_manager_install_failed event itself carries) means this can finally show
      # the same "needs you to open Marketplace" detail the built-in notification does, not just the
      # generic text. Not passive: a failure deserves attention, same as needs-manual-action below.
      - conditions:
          - condition: trigger
            id: failed_changed
          - "{{ notify_install_failed }}"
          # Same restart-burst reasoning as the pending branch above.
          - "{{ trigger.from_state is not none }}"
        sequence:
          - variables:
              before: "{{ trigger.from_state.attributes.entities | default([]) }}"
              before_ids: "{{ before | map(attribute='entity_id') | list }}"
              # entity_id + to_version + reason, found live 2026-11-09: the
              # repeat below used to loop over `after` as a whole, so *any*
              # change to this sensor (one entity's own failure resolving,
              # say) re-sent every other still-failed entity's own
              # notification right along with it, even though nothing about
              # that one had actually changed since it was last shown.
              # Diffed per entry below instead of resent wholesale.
              after: "{{ trigger.to_state.attributes.entities | default([]) }}"
              after_ids: "{{ after | map(attribute='entity_id') | list }}"
          - repeat:
              for_each: "{{ before_ids | reject('in', after_ids) | list }}"
              sequence:
                - action: "{{ notify_target }}"
                  data:
                    message: "clear_notification"
                    data:
                      tag: "update_manager_failed_{{ repeat.item }}"
          - repeat:
              for_each: "{{ after }}"
              sequence:
                - if: >-
                    {{ before
                       | selectattr('entity_id', 'eq', repeat.item.entity_id)
                       | selectattr('to_version', 'eq', repeat.item.to_version)
                       | selectattr('reason', 'eq', repeat.item.reason)
                       | list | count > 0 }}
                  then: []
                  else:
                    - action: "{{ notify_target }}"
                      data:
                        title: "Update Manager: Update failed"
                        message: >-
                          {{ state_attr(repeat.item.entity_id, 'friendly_name') | regex_replace("\\s*Update$", "") }}
                          {% if repeat.item.reason == "warning_not_accepted" -%}
                          needs you to open Marketplace once and accept its first-run warning.
                          {%- else -%}
                          couldn't be updated to version {{ repeat.item.to_version }}. Check the Home
                          Assistant logs, or install it manually.
                          {%- endif %}
                        data:
                          url: /update-manager/updates
                          clickAction: /update-manager/updates
                          tag: "update_manager_failed_{{ repeat.item.entity_id }}"
                          channel: "Update Manager"
                          notification_icon: "mdi:update"

      # Needs a manual install: the one notification type that actually needs you, so this one keeps
      # the normal (not passive) importance, and ships with an Install button right on it.
      - conditions:
          - condition: trigger
            id: needs_manual_action
          - "{{ notify_manual_action }}"
          # Same restart-burst reasoning as the pending branch above --
          # confirmed live, 2026-11-08: every entity already "ready, but
          # won't auto-install" before a restart got re-notified for it,
          # all at once, the instant HA started back up.
          - "{{ trigger.from_state is not none }}"
        sequence:
          - variables:
              before: "{{ trigger.from_state.attributes.entities | default([]) }}"
              before_ids: "{{ before | map(attribute='entity_id') | list }}"
              # entity_id + installed_version + latest_version, found live
              # 2026-11-09: the repeat below used to loop over `after` as a
              # whole, so *any* change to this sensor -- another, unrelated
              # queued sibling finishing, say -- re-sent every other still-
              # ready-but-manual entity's own notification right along with
              # it, even though nothing about that one had actually changed
              # since it was last shown. Diffed per entry below instead of
              # resent wholesale.
              after: "{{ trigger.to_state.attributes.entities | default([]) }}"
              after_ids: "{{ after | map(attribute='entity_id') | list }}"
          - repeat:
              for_each: "{{ before_ids | reject('in', after_ids) | list }}"
              sequence:
                - action: "{{ notify_target }}"
                  data:
                    message: "clear_notification"
                    data:
                      tag: "update_manager_manual_{{ repeat.item }}"
          - repeat:
              for_each: "{{ after }}"
              sequence:
                - if: >-
                    {{ before
                       | selectattr('entity_id', 'eq', repeat.item.entity_id)
                       | selectattr('installed_version', 'eq', repeat.item.installed_version)
                       | selectattr('latest_version', 'eq', repeat.item.latest_version)
                       | list | count > 0 }}
                  then: []
                  else:
                    - action: "{{ notify_target }}"
                      data:
                        title: "Update Manager: Ready, but won't auto-install"
                        message: >-
                          {{ state_attr(repeat.item.entity_id, 'friendly_name') | regex_replace("\\s*Update$", "") }}:
                          {{ repeat.item.installed_version }} → {{ repeat.item.latest_version }}
                        data:
                          tag: "update_manager_manual_{{ repeat.item.entity_id }}"
                          url: /update-manager/updates
                          clickAction: /update-manager/updates
                          channel: "Update Manager"
                          notification_icon: "mdi:update"
                          actions:
                            - action: "UM_INSTALL_{{ repeat.item.entity_id }}"
                              title: "Install now"
                              authenticationRequired: true

      # Handles the Install button above. The entity_id lives inside the action id itself
      # (UM_INSTALL_update.xxx), not a separate data field: the Companion App only echoes other data
      # fields back on Android, never on iOS.
      - conditions:
          - condition: trigger
            id: notification_action
          - "{{ notify_manual_action }}"
          - "{{ trigger.event.data.action.startswith('UM_INSTALL_') }}"
        sequence:
          - variables:
              target_entity: "{{ trigger.event.data.action | regex_replace('^UM_INSTALL_', '') }}"
          - action: update.install
            target:
              entity_id: "{{ target_entity }}"
          - action: "{{ notify_target }}"
            data:
              message: "clear_notification"
              data:
                tag: "update_manager_manual_{{ target_entity }}"
