[mypy]
# Matches the Python version Home Assistant itself requires, not whatever
# Python happens to run mypy locally -- without this, syntax/stdlib checks
# run against the wrong target and produce false positives.
python_version = 3.13
# homeassistant itself can't be installed in this project's own local dev
# environment (see quality_scale.yaml's own test-coverage/
# config-flow-test-coverage comments for the same limitation), so every
# homeassistant.* import resolves to Any instead of real type stubs.
# Still checks this project's own code against itself either way.
ignore_missing_imports = True
