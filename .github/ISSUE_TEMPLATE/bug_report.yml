name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in what you can below.
  - type: input
    id: project-version
    attributes:
      label: Project version
      description: The version of this integration/card you're running (manifest.json version, or the version shown at the bottom of the editor/panel).
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.8.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can reliably trigger this, the exact steps help a lot.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A screenshot of what you're seeing, especially for anything about the panel, card, or dialog UI.
    validations:
      required: false
  - type: textarea
    id: settings-export
    attributes:
      label: Settings export
      description: >
        Press "Copy settings" in the Settings page footer (available since v0.18) and paste the result here. Gives a complete picture of your configuration without a round of follow-up questions.
      render: json
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any relevant errors from Home Assistant's own logs (Settings > System > Logs), or your browser's console for a frontend issue.
      render: shell
    validations:
      required: false
